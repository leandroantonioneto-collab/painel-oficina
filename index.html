#stage{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);padding:26px 36px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;height:64px;background:var(--blue);border-radius:14px;padding:0 26px;flex:none}
.top h1{margin:0;font-weight:700;font-size:40px;letter-spacing:.5px}
.chip{background:var(--bg);border-radius:999px;padding:6px 18px;font-size:28px;font-weight:700;letter-spacing:.5px}
.screen{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.kpis{display:grid;gap:14px;height:96px;flex:none}
.k{background:var(--card);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.k .l{font-size:17px;color:var(--tx2)}
.k .v{font-size:50px;font-weight:700;line-height:1}
.k.red{background:var(--redbg);border:2px solid #ff6b6b}.k.red .l{color:#ffb3b3}
.k.blue{background:#142c5c;border:2px solid #5d8cff}.k.blue .l{color:#b9cdfa}
.k.dash{border:2px dashed var(--tx3)}
.big{display:flex;flex-direction:row;align-items:center;gap:18px;padding:12px 20px}
.big .v{font-size:64px;color:var(--green2)}
.bar{height:8px;background:#24406f;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--green)}
.infos{display:grid;grid-template-columns:200px repeat(4,minmax(0,1fr));gap:12px;height:68px;flex:none}
.infos .h{background:var(--amber);color:#1d1405;border-radius:12px;display:flex;align-items:center;padding:0 18px;font-size:25px;font-weight:700;line-height:1.05}
.infos .i{background:var(--card);border-radius:12px;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.infos .i b{font-size:12px;letter-spacing:.06em}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.infos .i span{font-size:15px;line-height:1.25;color:#dfe7f3}
.tbl{flex:1;background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.row{display:grid;align-items:center;border-top:1px solid var(--line)}
.hd{height:44px;background:var(--card2);font-size:13px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;border:0;flex:none}
.foot{margin-top:auto;padding:6px 14px;font-size:14px;color:#8fa8cc;border-top:1px solid var(--line)}
.pf{font-weight:700;font-size:26px;white-space:nowrap}
.top h1,.chip,.k .l,#upd,#today{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k{overflow:hidden}
.pill{border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.p-venc{background:var(--red);color:#fff}.p-hoje{background:var(--amber);color:#1d1405}.p-sem{border:2px dashed var(--tx3);color:#c9d6ea;padding:1px 12px}.p-ok{background:rgba(63,197,126,.18);color:var(--green2)}.p-lim{background:var(--amber);color:#1d1405}.p-done{color:var(--tx3);font-weight:500}.p-nd{border:1px dashed var(--tx3);color:var(--tx3);font-weight:500}
.dbox{min-width:64px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.d30{background:var(--red);color:#fff}.d15{background:var(--amber);color:#1d1405}.d8{border:2px solid var(--amber);color:var(--amber2)}
.cell{width:34px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.c-ok{background:var(--greenbg);color:#e6fff0}.c-late{background:var(--red);color:#fff;font-size:18px}.c-today{width:48px;background:var(--today);color:#fff;font-size:12px}.c-plan{border:2px solid var(--tx3);color:#c9d6ea}
.dcol{display:flex;align-items:center;justify-content:center;height:100%;border-left:1px solid var(--line)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;align-content:center;font-size:15px;color:#c9d6ea}
.legend span{display:flex;align-items:center;gap:8px}.legend .cell{width:26px;height:22px;font-size:12px}
.bottom{display:flex;align-items:center;gap:22px;height:54px;flex:none}
.btn{height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--tx);font:600 18px 'IBM Plex Sans',sans-serif;cursor:pointer;padding:0 20px}
.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
select.btn{padding:0 12px}
.prog{flex:1;display:flex;align-items:center;gap:14px}
.prog .bar>div{background:#5d8cff;transition:width 1s linear}
.muted{color:var(--tx2)}

:root{--x-tx2b:#c9d6ea;--x-blue:#8fb2ff;--x-amber:#ffcf6b;--x-soft:#dfe7f3;--x-red:#ff8a8a;--x-strong:#eef3fa;--x-green:#6fe3a2;--x-foot:#8fa8cc;--x-soft2:#e6ecf5;--x-dim:#5f769c;--x-pur1:#d4b8ff;--x-pur2:#b28cff;--x-pur3:#d8c6ff;--x-pur4:#c9b8ea;--x-purbg1:#241a3e;--x-purbg2:#3a2c5e;--x-purbg3:#1a0f33;--x-donebg:rgba(31,122,71,.22);--x-ambbg:#3d2f12;--x-amblbl:#f6e2b3}
/* ===== TEMA DIURNO (fundo branco) ===== */
html[data-tema="claro"]{--bg:#ffffff;--card:#f2f5fa;--card2:#e3e9f3;--line:#d5dde9;--line2:#c3cedf;--tx:#13233f;--tx2:#4a5d7c;--tx3:#7d8ca5;--blue:#1f4fb4;--today:#2f62d9;--green:#1e9e5a;--green2:#13834a;--greenbg:#1f8a4f;--amber:#e0a52e;--amber2:#a86400;--red:#d93a3a;--red2:#c42222;--redbg:#fdecec;--x-tx2b:#3d4f6b;--x-blue:#1f4fb4;--x-amber:#a86400;--x-soft:#2c3e5c;--x-red:#c42222;--x-strong:#13233f;--x-green:#13834a;--x-foot:#5a6f90;--x-soft2:#2c3e5c;--x-dim:#7d8ca5;--x-pur1:#6b3fc4;--x-pur2:#7c4ddb;--x-pur3:#5a2fb0;--x-pur4:#5a4a80;--x-purbg1:#f1eaff;--x-purbg2:#d9c8ff;--x-purbg3:#efe6ff;--x-donebg:rgba(30,158,90,.14);--x-ambbg:#fff3d6;--x-amblbl:#7a4b00}
html[data-tema="claro"],html[data-tema="claro"] body{background:#fff}
html[data-tema="claro"] .top{color:#fff}
html[data-tema="claro"] .chip{background:#fff;color:#1f4fb4}
html[data-tema="claro"] .k,html[data-tema="claro"] .infos .i,html[data-tema="claro"] .tbl{border:1px solid var(--line)}
html[data-tema="claro"] .k.red{background:#fdecec;border:2px solid #e05656}html[data-tema="claro"] .k.red .l{color:#a32020}
html[data-tema="claro"] .k.blue{background:#e8efff;border:2px solid #5d8cff}html[data-tema="claro"] .k.blue .l{color:#2a4fa8}
html[data-tema="claro"] .k.dash{border:2px dashed var(--tx3)}
html[data-tema="claro"] .bar{background:#dbe3ef}
html[data-tema="claro"] .infos .i span{color:#2c3e5c}
html[data-tema="claro"] .foot{color:#5a6f90}
html[data-tema="claro"] .p-sem{color:#3d4f6b}html[data-tema="claro"] .p-ok{background:rgba(30,158,90,.14)}
html[data-tema="claro"] .d8{color:#a86400}
html[data-tema="claro"] .c-ok{color:#fff}html[data-tema="claro"] .c-plan{color:#3d4f6b}
html[data-tema="claro"] .legend{color:#3d4f6b}
html[data-tema="claro"] .btn.on{background:#1f4fb4;color:#fff;border-color:#1f4fb4}
html[data-tema="claro"] #upd{color:#dbe6ff!important}
html[data-tema="claro"] #lock{background:#fff!important}
html[data-tema="claro"] #lockForm{background:#f2f5fa!important;border:1px solid #d5dde9;color:#13233f!important}
html[data-tema="claro"] #lockForm label{color:#3d4f6b!important}
html[data-tema="claro"] #pw{background:#fff!important;color:#13233f!important;border-color:#c3cedf!important}
</style>
<script>
/* tema: escuro (noturno), claro (diurno) ou auto (diurno das 6h às 18h) */
function temaEscolhido(){ try { return localStorage.getItem('painelTV.tema') || 'escuro'; } catch (e) { return 'escuro'; } }
function aplicarTema(){ let t = temaEscolhido(); if (t === 'auto') { const h = new Date().getHours(); t = (h >= 6 && h < 18) ? 'claro' : 'escuro'; } document.documentElement.setAttribute('data-tema', t); }
aplicarTema(); setInterval(aplicarTema, 60000);
</script>

<div id="stage">
  <div class="top">
    <div style="display:flex;align-items:center;gap:22px"><h1 class="cond">GESTÃO VISUAL · OFICINA</h1><span class="chip cond" id="chip"></span></div>
    <div style="display:flex;align-items:center;gap:26px;font-size:20px"><span style="color:#c9dafc" id="upd"></span><span class="cond" style="font-size:34px;font-weight:600" id="today"></span></div>
  </div>
  <div class="screen" id="s0"></div>
  <div class="screen" id="s1" style="display:none"></div>
  <div class="screen" id="s2" style="display:none"></div>

    <div style="display:flex;gap:10px"><button class="btn" id="t0" type="button">1 · Máquinas paradas</button><button class="btn" id="t1" type="button">2 · Preventiva da semana</button><button class="btn" id="t2" type="button">3 · Preventiva - Próxima semana</button><button class="btn" id="t3" type="button">4 · Desmobilização · 15 dias</button></div>

      <button class="btn" id="pause" type="button" style="min-width:130px">Pausar</button>

    </div>
  </div>
</div>

    <label style="display:flex;align-items:center;gap:12px;font-size:18px;color:#c9d6ea"><input id="rem" type="checkbox" checked style="width:24px;height:24px"> Lembrar nesta TV</label>
    <button type="submit" style="height:60px;border-radius:12px;border:0;background:#3b6fe6;color:#fff;font:700 22px 'IBM Plex Sans',sans-serif;cursor:pointer">Abrir painel</button>

  </form>
</div>

<script>
function iniciar(DADOS){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (n) => Number(n).toLocaleString('pt-BR');
  const parseDM = (s, y) => { const p = s.split('/'); return new Date(y || Number(p[2]) || 2026, Number(p[1]) - 1, Number(p[0])); };
  const WD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  // ajuste à tela da TV
  function fit(){ const s = Math.min(innerWidth / 1920, innerHeight / 1080); const st = $('stage'); st.style.transform = 'scale(' + s + ')'; st.style.left = ((innerWidth - 1920 * s) / 2) + 'px'; st.style.top = ((innerHeight - 1080 * s) / 2) + 'px'; }
  addEventListener('resize', fit); fit();

  // relógio
  function clock(){ const d = new Date(); $('today').textContent = WD[d.getDay()] + ' · ' + d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
  clock(); setInterval(clock, 20000);
  $('upd').textContent = 'Atualizado ' + DADOS.atualizado;


  // ===== MONTA SEMANA ATUAL E PRÓXIMA A PARTIR DA PROGRAMAÇÃO DO MÊS =====
  (function montarPreventiva(){
    const M = DADOS.preventivaMes, hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const dt = (s) => { const p = s.split('/'); return new Date(hoje.getFullYear(), Number(p[1]) - 1, Number(p[0])); };
    const ini = (w) => dt(w.dias[0][1]), fim = (w) => dt(w.dias[w.dias.length - 1][1]);
    let iAt = M.semanas.findIndex((w) => hoje >= ini(w) && hoje <= fim(w));
    if (iAt < 0) iAt = hoje < ini(M.semanas[0]) ? 0 : M.semanas.length - 1;
    const atual = M.semanas[iAt];
    let prox = M.semanas[Math.min(iAt + 1, M.semanas.length - 1)];
    if (prox === atual && M.seguinte && M.seguinte.length) {
      // última semana do mês: a próxima vem da programação do mês seguinte (ex.: 25-31/10 -> 01-07/11)
      const dtS = (s) => { const p = s.split('/'), d = new Date(hoje.getFullYear(), Number(p[1]) - 1, Number(p[0])); if (d < dt(atual.dias[0][1])) d.setFullYear(d.getFullYear() + 1); return d; };
      const seg = M.seguinte.find((w) => dtS(w.dias[w.dias.length - 1][1]) > fim(atual));
      if (seg) prox = seg;
    }
    const num = (h) => Number(String(h).replace(/\./g, '').replace(',', '.')) || 0;
    const valida = (it) => !/TRANSFERIDO/i.test(it[8]);
    const unicos = (lista) => { const vis = {}; return lista.filter((it) => { if (vis[it[0]]) return false; vis[it[0]] = 1; return true; }); };
    const leve = (mod) => /OROCH|KWID|SAVEIRO|BUS |DAILY|STRADA|HILUX|S10|AMAROK|RENEGADE/i.test(mod);
    DADOS.preventiva = {
      titulo: atual.titulo, dias: atual.dias, terceiros: M.terceiros,
      nota: 'Tolerância de 10% do intervalo · intervalo: 250 h (máquinas e caminhões) e 10.000 km (veículos leves e ônibus) · ' + (atual.horimetroData ? 'último horímetro: leitura do abastecimento até ' + atual.horimetroData : 'último horímetro: sem leitura de abastecimento nesta semana'),
      linhas: unicos(atual.itens.filter(valida)).map((it) => [it[0], it[1], num(it[2]), it[3], it[4] || '—', it[5], it[6], it[7] || '—', leve(it[1]) ? 10000 : 250, it[10] == null ? null : it[10]])
    };
    // próxima semana
    const paradas = {}; DADOS.paradas.linhas.forEach((l) => { paradas[l[0]] = l; });
    const brand = (it) => { const t = (it[8] + ' ' + it[1]).toUpperCase(); const m = t.match(/GARANTI[AV]A?\s+(?:CHASSI\s+)?(VOLVO|CAT|IVECO|HAMM|RENAULT|JEEP|MB|MERCEDES)/); if (m) return m[1]; if (/GARANTIA/.test(t)) return /924|320|336|140|D6|CP 5/.test(t) ? 'CAT' : ''; return null; };
    const lista = unicos(prox.itens.filter(valida));
    const itens = lista.map((it) => {
      const fl = [], obs = it[8].toUpperCase();
      if (paradas[it[0]]) fl.push('parada');
      if (it[7] === 'Parcial') fl.push('parcial');
      const b = brand(it); if (b !== null) fl.push('gar:' + b);
      const fe = obs.match(/(?:EXECUTADO|REALIZADO) EM (\d\d\/\d\d)/); if (it[6]) fl.push('feita:' + (fe ? fe[1] : 'OK'));
      if (/EM ABERTO/.test(obs)) fl.push('aberta');
      if (/IMPLEMENTO/.test(obs) && !b) fl.push('impl');
      return [it[5], it[0], it[1], it[3], it[4], it[7], fl];
    });
    const dname = (i) => prox.dias[i][0].charAt(0) + prox.dias[i][0].slice(1).toLowerCase() + ' ' + prox.dias[i][1];
    const pend = itens.filter((x) => !x[6].some((f) => f.indexOf('feita:') === 0));
    const aprov = pend.filter((x) => paradas[x[1]]).map((x) => { const p = paradas[x[1]]; return [x[1], dname(x[0]) + ' · parada há ' + p[6] + ' dias' + (x[6].find((f) => f.indexOf('gar:') === 0) ? ' · garantia ' + x[6].find((f) => f.indexOf('gar:') === 0).slice(4).toLowerCase() : '')]; });
    const falta = {}; lista.forEach((it) => { falta[it[0]] = it[9] || ''; });
    const pecas = pend.filter((x) => x[5] === 'Parcial').map((x) => [x[1], dname(x[0]) + ' · seq ' + x[3] + (falta[x[1]] ? ' · falta ' + falta[x[1]].toLowerCase() : '')]);
    const revisar = [];
    prox.itens.filter((it) => !valida(it)).forEach((it) => revisar.push([it[0], 'Transferido · fora da conta']));
    lista.filter((it) => !it[4]).forEach((it) => revisar.push([it[0], 'Sem OS aberta']));
    lista.filter((it) => !it[7] && !it[6]).forEach((it) => revisar.push([it[0], 'Caixa não informada']));
    lista.filter((it) => /EM ABERTO/i.test(it[8])).forEach((it) => revisar.push([it[0], 'OS anterior ainda em aberto']));
    const dup = {}; prox.itens.forEach((it) => { dup[it[0]] = (dup[it[0]] || 0) + 1; }); Object.keys(dup).filter((k) => dup[k] > 1).forEach((k) => revisar.push([k, 'Duplicada na semana']));
    prox.dias.forEach((d, i) => { const n = itens.filter((x) => x[0] === i).length; if (n >= 7) revisar.push([dname(i), n + ' preventivas no mesmo dia · avaliar distribuir']); });
    const mes = M.semanas.map((w, i) => {
      const its = unicos(w.itens.filter(valida)), feitos = its.filter((it) => it[6]).length, pct = its.length ? Math.round(feitos / its.length * 100) : 0;
      if (i < iAt) return ['S' + w.n, pct + '%', feitos + ' de ' + its.length + ' · encerrada', pct, pct >= 80 ? 'var(--x-green)' : 'var(--x-amber)'];
      if (i === iAt) return ['S' + w.n, feitos + '/' + its.length, 'semana atual', pct, 'var(--x-blue)'];
      return ['S' + w.n, String(its.length), 'programadas · ' + its.filter((it) => it[7] === 'Parcial').length + ' parciais', 0, 'var(--x-tx2b)'];
    });
    DADOS.proxima = { titulo: prox === atual ? prox.titulo + ' (fim da programação)' : prox.titulo, dias: prox.dias, itens, mes, aprov, pecas, revisar: revisar.slice(0, 5) };
  })();

  // ===== MÁQUINAS PARADAS =====
  function renderParadas(){
    const P = DADOS.paradas, ref = parseDM(P.dataRelatorio);
    const rows = P.linhas.map((a) => {
      let k = 'sem', sit = 'Sem previsão';
      if (a[5]) { const diff = Math.round((parseDM(a[5], ref.getFullYear()) - ref) / 864e5);

  // ===== DESMOBILIZAÇÃO · PRÓXIMOS 15 DIAS =====
  function renderDesmob(){
    const D = DADOS.desmob;
    if (!D) { $('s3').innerHTML = '<div class="k"><span class="l">Sem dados de desmobilização</span></div>'; return; }
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const L = D.linhas.map((l) => {
      const dt = parseDM(l[3]), dias = Math.round((dt - hoje) / 864e5);
      const dest = l[2] === 'Alugado' ? 'Devolver ao fornecedor' : ((l[4].match(/destino\s+([^\s|·]+)/i) || [])[1] || '');
      return { l, dt, dias, dest, modelo: l[5] || '—' };
    });
    const n = L.length, prox3 = L.filter((x) => x.dias <= 3).length;
    const proprios = L.filter((x) => x.l[2] === 'Próprio').length, alugados = n - proprios;
    const porDia = {}; L.forEach((x) => { porDia[x.l[3]] = (porDia[x.l[3]] || 0) + 1; });
    const dias = Object.keys(porDia).sort((a, b) => parseDM(a) - parseDM(b));
    const maxDia = dias.reduce((m, d) => Math.max(m, porDia[d]), 0);
    const pico = dias.find((d) => porDia[d] === maxDia) || '—';
    const destinos = {}; L.forEach((x) => { if (x.dest) destinos[x.dest] = (destinos[x.dest] || 0) + 1; });
    const dstTxt = Object.keys(destinos).map((k) => k + ' ' + destinos[k]).join(' · ') || 'Não informado';
    const primeiro = dias[0] || '—';
    const cols = '190px 250px 220px 100px 130px 80px 150px 210px minmax(0,1fr)';
    const rowH = Math.max(34, Math.min(52, Math.floor(600 / Math.max(n, 1))));
    const dcls = (d) => d <= 3 ? 'd30' : d <= 7 ? 'd15' : 'd8';
    const sitOf = (d) => d < 0 ? ['venc', 'Vencida'] : d === 0 ? ['hoje', 'Hoje'] : d <= 3 ? ['venc', 'Faltam ' + d + ' d'] : ['ok', 'Faltam ' + d + ' d'];
    $('s3').innerHTML =
      '<div class="kpis" style="grid-template-columns:1.6fr repeat(4,minmax(0,1fr))">' +
        '<div class="k big"><span class="v cond">' + n + '</span><span class="l" style="font-size:20px;color:var(--tx2)">equipamentos programados<br>' + esc(D.janela) + '</span></div>' +
        '<div class="k red"><span class="l">Saem em até 3 dias</span><span class="v cond" style="color:var(--red2)">' + prox3 + '<span style="font-size:22px;color:var(--amber2)"> · próxima ' + esc(primeiro) + '</span></span></div>' +
        '<div class="k"><span class="l">Pico no dia</span><span class="v cond">' + maxDia + '<span style="font-size:24px;color:var(--tx2)"> em ' + esc(pico) + '</span></span></div>' +
        '<div class="k"><span class="l">Próprios</span><span class="v cond">' + proprios + '</span></div>' +
        '<div class="k"><span class="l">Alugados</span><span class="v cond">' + alugados + '</span></div>' +
      '</div>' +
      '<div class="infos"><div class="h cond">DESMOBILIZAÇÃO</div>' +
        '<div class="i"><b style="color:var(--x-green)">DIAS COM SAÍDA</b><span class="clamp">' + dias.length + ' datas · ' + dias.map((d) => d.slice(0, 5) + ' (' + porDia[d] + ')').join(' · ') + '</span></div>' +
        '<div class="i"><b style="color:var(--x-amber)">DESTINOS</b><span class="clamp">' + esc(dstTxt) + '</span></div>' +
        '<div class="i"><b style="color:var(--x-tx2b)">FONTE</b><span class="clamp">Controle de Frota · status Programado</span></div>' +
        '<div class="i"><b style="color:var(--x-tx2b)">ATUALIZADO</b><span class="clamp">' + esc(D.fonte.split(' gerado em ')[1] || '') + '</span></div>' +
      '</div>' +
      '<div class="tbl"><div class="row hd" style="grid-template-columns:' + cols + '"><div style="padding-left:14px">Equipamento</div><div>Família</div><div>Modelo</div><div>Tipo</div><div>Data prevista</div><div style="text-align:center">Dias</div><div>Situação</div><div>Destino</div><div>Observação</div></div>' +
        (n ? L.map((x) => { const s = sitOf(x.dias); return '<div class="row" style="grid-template-columns:' + cols + ';height:' + rowH + 'px">' +
          '<div style="padding-left:14px"><span class="pf cond" style="font-size:28px">' + esc(x.l[0]) + '</span></div>' +
          '<div class="clamp" style="font-size:15px;line-height:1.2;color:var(--tx2);padding-right:10px">' + esc(x.l[1]) + '</div>' +
          '<div class="clamp" style="font-size:15px;line-height:1.2;color:var(--x-soft);padding-right:10px">' + esc(x.modelo) + '</div>' +
          '<div style="font-size:16px;color:var(--x-soft)">' + esc(x.l[2]) + '</div>' +
          '<div class="cond" style="font-size:24px;font-weight:600">' + esc(x.l[3]) + '</div>' +
          '<div style="display:flex;justify-content:center"><span class="dbox cond ' + dcls(x.dias) + '">' + Math.max(x.dias, 0) + '</span></div>' +
          '<div><span class="pill p-' + s[0] + '">' + s[1] + '</span></div>' +
          '<div style="font-size:18px;font-weight:600;color:' + (x.dest ? 'var(--x-strong)' : 'var(--x-tx2b)') + ';padding-right:8px">' + esc(x.dest || '—') + '</div>' +
          '<div class="clamp" style="padding:0 16px;font-size:15px;line-height:1.25;color:var(--x-soft)">' + esc(x.l[4]) + '</div>' +
        '</div>'; }).join('') : '<div style="padding:30px;font-size:22px;color:var(--tx2)">Nenhum equipamento programado para desmobilização nesta janela.</div>') +
        '<div class="foot">Fonte: ' + esc(D.fonte) + '</div></div>';
  }

  // ===== ROTAÇÃO =====
  let screen = 0, elapsed = 0, paused = false, secs = 30;
  try { secs = Number(localStorage.getItem('painelTV.secs')) || 30; } catch (e) {}
  $('secs').value = String(secs);
  function show(){
    $('s0').style.display = screen === 0 ? 'flex' : 'none';
    $('s1').style.display = screen === 1 ? 'flex' : 'none';
    $('s2').style.display = screen === 2 ? 'flex' : 'none';
    $('s3').style.display = screen === 3 ? 'flex' : 'none';
    $('t0').classList.toggle('on', screen === 0); $('t1').classList.toggle('on', screen === 1); $('t2').classList.toggle('on', screen === 2); $('t3').classList.toggle('on', screen === 3);
    $('chip').textContent = screen === 0 ? 'MÁQUINAS PARADAS · ' + DADOS.obra : screen === 1 ? 'PREVENTIVA · ' + DADOS.preventiva.titulo : screen === 2 ? 'PREVENTIVA - PRÓXIMA SEMANA · ' + DADOS.proxima.titulo : 'DESMOBILIZAÇÃO · PRÓXIMOS 15 DIAS';
    $('pbar').style.width = (elapsed / secs * 100) + '%';
    $('rest').textContent = paused ? 'Pausado' : 'Próxima tela em ' + Math.max(0, secs - elapsed) + ' s';
    $('pause').textContent = paused ? 'Continuar' : 'Pausar';
  }
  const go = (i) => { screen = i; elapsed = 0; show(); };
  $('t0').onclick = () => go(0); $('t1').onclick = () => go(1); $('t2').onclick = () => go(2); $('t3').onclick = () => go(3);
  $('pause').onclick = () => { paused = !paused; show(); };
  $('secs').onchange = (e) => { secs = Number(e.target.value) || 30; elapsed = 0; try { localStorage.setItem('painelTV.secs', String(secs)); } catch (er) {} show(); };
  $('tema').value = temaEscolhido();
  $('tema').onchange = (e) => { try { localStorage.setItem('painelTV.tema', e.target.value); } catch (er) {} aplicarTema(); };
  setInterval(() => { if (paused) return; elapsed++; if (elapsed >= secs) { elapsed = 0; screen = (screen + 1) % 4; } show(); }, 1000);
  show();

  // recarrega a página a cada 10 min para pegar a versão nova do arquivo
  setTimeout(() => location.reload(), 10 * 60 * 1000);
}
</script>

<script>
(function(){
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function abrir(senha){
    const E = DADOS_ENC;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(E.iv) }, key, b64(E.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const lock = document.getElementById('lock'), msg = document.getElementById('lockMsg');
  async function tentar(senha, lembrar){
    try {
      const dados = await abrir(senha);
      if (lembrar) { try { localStorage.setItem('painelTV.pw', senha); } catch (e) {} }
      lock.style.display = 'none';
      iniciar(dados);
      return true;
    } catch (e) {
      try { localStorage.removeItem('painelTV.pw'); } catch (er) {}
      return false;
    }
  }
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'Este navegador não suporta a abertura segura. Use um navegador atualizado.'; return; }
  let salva = null; try { salva = localStorage.getItem('painelTV.pw'); } catch (e) {}
  if (salva) tentar(salva, true);
  document.getElementById('lockForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.textContent = 'Abrindo…';
    const ok = await tentar(document.getElementById('pw').value, document.getElementById('rem').checked);
    if (!ok) msg.textContent = 'Senha incorreta.';
  });
})();
</script>
